<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Voting Experience</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --card: rgba(255, 255, 255, 0.14);
      --card-strong: rgba(255, 255, 255, 0.2);
      --text: #f8fafc;
      --muted: #dbe4f0;
      --accent-1: #8b5cf6;
      --accent-2: #06b6d4;
      --accent-3: #f59e0b;
      --success: #10b981;
      --danger: #fb7185;
      --shadow: 0 20px 50px rgba(2, 6, 23, 0.35);
      --radius: 28px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(139, 92, 246, 0.35), transparent 35%),
        radial-gradient(circle at top right, rgba(6, 182, 212, 0.28), transparent 32%),
        radial-gradient(circle at bottom center, rgba(245, 158, 11, 0.18), transparent 30%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .shell {
      width: min(1100px, 100%);
    }

    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.08));
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      overflow: hidden;
      position: relative;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent 35%, transparent 65%, rgba(255,255,255,0.05));
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 34px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--text);
    }

    .timer-chip {
      background: linear-gradient(135deg, rgba(139,92,246,0.28), rgba(6,182,212,0.18));
    }

    .heading {
      text-align: center;
      margin: 8px 0 28px;
    }

    .eyebrow {
      color: #c4b5fd;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-weight: 800;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 3vw, 48px);
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: white;
    }

    .question-wrap {
      margin: 22px auto 28px;
      max-width: 900px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 26px;
      padding: 30px 28px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .question {
      margin: 0;
      text-align: center;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1.3;
      font-weight: 800;
      color: #ffffff;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 18px;
      margin-top: 12px;
      line-height: 1.5;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .vote-btn {
      position: relative;
      border: none;
      border-radius: 24px;
      min-height: 112px;
      padding: 24px 20px;
      font-size: clamp(24px, 2.2vw, 32px);
      font-weight: 800;
      letter-spacing: -0.01em;
      color: white;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      box-shadow: 0 16px 28px rgba(0,0,0,0.16);
      overflow: hidden;
    }

    .vote-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -140%;
      width: 80%;
      height: 100%;
      transform: skewX(-22deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
      transition: left 0.55s ease;
    }

    .vote-btn:hover::before {
      left: 160%;
    }

    .vote-btn:hover {
      transform: translateY(-4px) scale(1.01);
      filter: brightness(1.04);
    }

    .vote-btn:active {
      transform: translateY(0) scale(0.992);
    }

    .vote-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .vote-btn span {
      position: relative;
      z-index: 1;
    }

    .option-a {
      background: linear-gradient(135deg, #7c3aed, #ec4899);
    }

    .option-b {
      background: linear-gradient(135deg, #0ea5e9, #14b8a6);
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .ghost-btn, .solid-btn, .restart-btn {
      border: none;
      border-radius: 16px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .ghost-btn {
      color: white;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 12px 20px rgba(2,6,23,0.18);
    }

    .solid-btn, .restart-btn {
      color: white;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      box-shadow: 0 14px 24px rgba(59,130,246,0.28);
    }

    .ghost-btn:hover, .solid-btn:hover, .restart-btn:hover {
      transform: translateY(-2px);
    }

    .ghost-btn:disabled, .solid-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-card {
      margin-top: 26px;
      padding: 26px;
      border-radius: 24px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.16);
    }

    .mini-label {
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .winner {
      font-size: clamp(28px, 2.5vw, 38px);
      font-weight: 900;
      color: #fde68a;
      margin-bottom: 14px;
      line-height: 1.25;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .score-box {
      border-radius: 18px;
      padding: 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.14);
    }

    .score-title {
      font-size: 15px;
      color: #dbeafe;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .score-value {
      font-size: 28px;
      font-weight: 900;
      color: white;
    }

    .summary-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .summary-title {
      margin: 0;
      font-size: clamp(30px, 3vw, 46px);
      font-weight: 900;
      color: white;
      letter-spacing: -0.02em;
    }

    .summary-note {
      margin-top: 12px;
      font-size: 18px;
      color: var(--muted);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
      margin-top: 28px;
    }

    .summary-box {
      border-radius: 22px;
      padding: 20px 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.09));
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 16px 26px rgba(2,6,23,0.2);
      min-height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .summary-number {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(139,92,246,0.9), rgba(6,182,212,0.9));
      color: white;
      font-weight: 900;
      font-size: 18px;
      margin-bottom: 14px;
      box-shadow: 0 10px 22px rgba(59,130,246,0.25);
    }

    .summary-question {
      font-size: 18px;
      line-height: 1.45;
      color: #ffffff;
      font-weight: 800;
      margin-bottom: 16px;
      min-height: 90px;
    }

    .summary-answer-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #cbd5e1;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .summary-answer {
      font-size: 22px;
      color: #fde68a;
      font-weight: 900;
      line-height: 1.3;
    }

    .summary-votes {
      margin-top: 10px;
      color: #dbeafe;
      font-size: 14px;
      line-height: 1.5;
    }

    .footer-actions {
      display: flex;
      justify-content: center;
      margin-top: 28px;
    }

    @media (max-width: 1100px) {
      .summary-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 860px) {
      .content { padding: 24px; }
      .buttons { grid-template-columns: 1fr; }
      .score-grid { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      body { padding: 16px; }
      .content { padding: 18px; }
      .question-wrap { padding: 22px 18px; }
      .summary-grid { grid-template-columns: 1fr; }
      .summary-box { min-height: auto; }
      .summary-question { min-height: auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="panel">
      <div class="content" id="app"></div>
    </div>
  </div>

  <script>
    const scenarios = [
      {
        text: "You find a wallet on the street. What do you do?",
        options: ["Keep it", "Return it"]
      },
      {
        text: "You have one free evening. What would you choose?",
        options: ["Watch a movie", "Go for exercise"]
      },
      {
        text: "You receive extra money this month. What do you do?",
        options: ["Save it", "Spend it"]
      },
      {
        text: "Your team can work in one way this week. Which do you prefer?",
        options: ["Work from home", "Go to the office"]
      },
      {
        text: "You can take a short vacation. Where do you go?",
        options: ["Beach", "Mountains"]
      }
    ];

    let currentScenario = 0;
    let votes = [0, 0];
    let timeLeft = 30;
    let timerInterval = null;
    let votingEnded = false;
    const resultsSummary = [];
    const app = document.getElementById('app');

    function renderScenario() {
      const scenario = scenarios[currentScenario];
      votes = [0, 0];
      timeLeft = 30;
      votingEnded = false;

      app.innerHTML = `
        <div class="topbar">
          <div class="chip">Question ${currentScenario + 1} / ${scenarios.length}</div>
          <div class="chip timer-chip" id="timerChip">⏳ 30 sec</div>
        </div>

        <div class="heading">
          <div class="eyebrow">Interactive Voting</div>
          <h1>Choose the strongest answer</h1>
        </div>

        <div class="question-wrap">
          <p class="question">${scenario.text}</p>
          <div class="subtitle">Audience members can vote during the countdown.</div>
        </div>

        <div class="buttons">
          <button class="vote-btn option-a" id="btn1"><span>${scenario.options[0]}</span></button>
          <button class="vote-btn option-b" id="btn2"><span>${scenario.options[1]}</span></button>
        </div>

        <div class="controls">
          <button class="ghost-btn" id="skipBtn">Skip Timer</button>
        </div>

        <div id="resultArea"></div>
      `;

      document.getElementById('btn1').addEventListener('click', () => addVote(0));
      document.getElementById('btn2').addEventListener('click', () => addVote(1));
      document.getElementById('skipBtn').addEventListener('click', endVotingEarly);

      startTimer();
    }

    function addVote(index) {
      if (votingEnded) return;
      votes[index]++;
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        const timerChip = document.getElementById('timerChip');
        if (timerChip) timerChip.textContent = `⏳ ${timeLeft} sec`;
        if (timeLeft <= 0) endVoting();
      }, 1000);
    }

    function endVotingEarly() {
      if (votingEnded) return;
      endVoting();
    }

    function endVoting() {
      clearInterval(timerInterval);
      votingEnded = true;

      const scenario = scenarios[currentScenario];
      const btn1 = document.getElementById('btn1');
      const btn2 = document.getElementById('btn2');
      const skipBtn = document.getElementById('skipBtn');
      if (btn1) btn1.disabled = true;
      if (btn2) btn2.disabled = true;
      if (skipBtn) skipBtn.disabled = true;

      let winnerText = '';
      let highestVotes = 0;

      if (votes[0] === votes[1]) {
        winnerText = `Tie: ${scenario.options[0]} / ${scenario.options[1]}`;
        highestVotes = votes[0];
      } else if (votes[0] > votes[1]) {
        winnerText = scenario.options[0];
        highestVotes = votes[0];
      } else {
        winnerText = scenario.options[1];
        highestVotes = votes[1];
      }

      resultsSummary.push({
        question: scenario.text,
        winner: winnerText,
        option1: scenario.options[0],
        option2: scenario.options[1],
        vote1: votes[0],
        vote2: votes[1],
        highestVotes
      });

      const resultArea = document.getElementById('resultArea');
      resultArea.innerHTML = `
        <div class="result-card">
          <div class="mini-label">Winning answer</div>
          <div class="winner">${winnerText}</div>
          <div class="score-grid">
            <div class="score-box">
              <div class="score-title">${scenario.options[0]}</div>
              <div class="score-value">${votes[0]}</div>
            </div>
            <div class="score-box">
              <div class="score-title">${scenario.options[1]}</div>
              <div class="score-value">${votes[1]}</div>
            </div>
          </div>
          <div class="controls">
            ${currentScenario < scenarios.length - 1
              ? '<button class="solid-btn" id="nextBtn">Next Question</button>'
              : '<button class="solid-btn" id="summaryBtn">Show Final Summary</button>'}
          </div>
        </div>
      `;

      if (currentScenario < scenarios.length - 1) {
        document.getElementById('nextBtn').addEventListener('click', nextScenario);
      } else {
        document.getElementById('summaryBtn').addEventListener('click', renderSummary);
      }
    }

    function nextScenario() {
      currentScenario++;
      renderScenario();
    }

    function renderSummary() {
      app.innerHTML = `
        <div class="summary-header">
          <div class="eyebrow">Final Summary</div>
          <h2 class="summary-title">Top Answer for Each Question</h2>
          <div class="summary-note">Five clean cards, one for each result.</div>
        </div>

        <div class="summary-grid">
          ${resultsSummary.map((item, index) => `
            <div class="summary-box">
              <div>
                <div class="summary-number">${index + 1}</div>
                <div class="summary-question">${item.question}</div>
              </div>
              <div>
                <div class="summary-answer-label">Selected answer</div>
                <div class="summary-answer">${item.winner}</div>
                <div class="summary-votes">${item.option1}: ${item.vote1} • ${item.option2}: ${item.vote2}</div>
              </div>
            </div>
          `).join('')}
        </div>

        <div class="footer-actions">
          <button class="restart-btn" id="restartBtn">Restart Session</button>
        </div>
      `;

      document.getElementById('restartBtn').addEventListener('click', restartAll);
    }

    function restartAll() {
      clearInterval(timerInterval);
      currentScenario = 0;
      votes = [0, 0];
      timeLeft = 30;
      votingEnded = false;
      resultsSummary.length = 0;
      renderScenario();
    }

    renderScenario();
  </script>
</body>
</html>
