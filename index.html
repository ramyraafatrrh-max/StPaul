<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Voting</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
      padding: 40px;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    button {
      padding: 15px 25px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2 id="title"></h2>
  <p id="question"></p>

  <button id="btn1"></button>
  <button id="btn2"></button>

  <p id="timer"></p>
  <div id="result"></div>
</div>

<script>
const scenarios = [
  {
    text: "You find a wallet. What do you do?",
    options: ["Keep it", "Return it"]
  },
  {
    text: "Work style?",
    options: ["Remote", "Office"]
  },
  {
    text: "Free time?",
    options: ["Movie", "Exercise"]
  },
  {
    text: "Extra money?",
    options: ["Save", "Spend"]
  },
  {
    text: "Travel?",
    options: ["Beach", "Mountains"]
  }
];

let current = 0;
let votes = [0, 0];
let time = 30;
let interval;

function loadScenario() {
  document.getElementById("title").innerText =
    "Scenario " + (current + 1) + " / " + scenarios.length;

  document.getElementById("question").innerText =
    scenarios[current].text;

  document.getElementById("btn1").innerText =
    scenarios[current].options[0];

  document.getElementById("btn2").innerText =
    scenarios[current].options[1];

  votes = [0, 0];
  time = 30;
  document.getElementById("result").innerHTML = "";

  startTimer();
}

document.getElementById("btn1").onclick = () => vote(0);
document.getElementById("btn2").onclick = () => vote(1);

function vote(i) {
  if (time > 0) {
    votes[i]++;
  }
}

function startTimer() {
  interval = setInterval(() => {
    time--;
    document.getElementById("timer").innerText =
      "Time left: " + time + " sec";

    if (time <= 0) {
      clearInterval(interval);
      showResult();
    }
  }, 1000);
}

function showResult() {
  let winner;

  if (votes[0] === votes[1]) {
    winner = "It's a tie!";
  } else if (votes[0] > votes[1]) {
    winner = scenarios[current].options[0];
  } else {
    winner = scenarios[current].options[1];
  }

  document.getElementById("result").innerHTML =
    "<h3>Winner: " + winner + "</h3>" +
    "<p>" + votes[0] + " vs " + votes[1] + "</p>";

  if (current < scenarios.length - 1) {
    setTimeout(() => {
      current++;
      loadScenario();
    }, 3000);
  } else {
    document.getElementById("result").innerHTML +=
      "<p><b>All scenarios finished 🎉</b></p>";
  }
}

loadScenario();
</script>

</body>
</html>
